<!DOCTYPE html>
<!--
  aprovacoes.html (tela 12 do Figma: Aprovação de ONGs e campanhas)
  Para que serve: o administrador aprova ou recusa ONGs novas (selo "ONG verificada"), campanhas
  solicitadas pelas ONGs (viram ativas) e pedidos de vínculo às campanhas criadas pela administração.
  Também modera vínculos já aceitos. Aceita ?aba=ongs|campanhas|vinculos. Quem abre: administrador.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aprove ONGs, campanhas e vínculos entre necessidades e campanhas.">
  <title>Aprovações · Conecta Doações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/principal.css">
  <link rel="stylesheet" href="../../css/paginas/admin.css">
  <link rel="icon" href="../../img/favicon.svg" type="image/svg+xml">
</head>
<!-- data-raiz diz ao JavaScript onde fica a raiz do site (para montar os links entre páginas em pastas diferentes); data-pagina diz qual item do menu marcar como atual -->
<body data-raiz="../../" data-pagina="aprovacoes">
  <!-- Link para quem navega só pelo teclado pular o cabeçalho; fica escondido e aparece quando recebe o foco -->
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <!-- Caixa vazia de propósito: o JavaScript (pagina.js e cabecalho.js) monta aqui o cabeçalho e o menu -->
  <header id="cabecalho"></header>

  <!-- <main> é o conteúdo principal da página (só existe um por página); o id="conteudo" é o destino do link "Pular para o conteúdo" -->
  <main id="conteudo" class="conteudo pilha pilha-grande">
    <nav class="breadcrumb" aria-label="Você está em">
      <ol role="list">
        <li><a href="painel.html">Painel</a></li>
        <li><span aria-current="page">Aprovações</span></li>
      </ol>
    </nav>

    <h1>Aprovação de ONGs e campanhas</h1>
    <!-- Área de avisos: o JavaScript mostra aqui as mensagens de sucesso e erro; aria-live="polite" faz o leitor de tela anunciar quando o texto muda -->
    <div id="area-alerta" class="area-alerta" aria-live="polite"></div>

    <!-- Caixa vazia de propósito: o JavaScript (abas.js) coloca aqui o grupo de abas. Clicar numa aba não muda de página, só troca o conteúdo da lista -->
    <div id="abas"></div>

    <!-- O conteúdo muda conforme a aba: tabela + detalhe (ONGs), tabela (campanhas), vínculos e moderação -->
    <section id="conteudo-aba" class="pilha pilha-grande"></section>
  </main>

  <!-- Caixa vazia de propósito: o JavaScript (rodape.js) monta aqui o rodapé -->
  <footer id="rodape"></footer>
  <!-- type="module" permite que este JavaScript use import e export para trazer funções de outros arquivos -->
  <script type="module" src="../../js/paginas/admin/aprovacoes.js"></script>
</body>
</html>
