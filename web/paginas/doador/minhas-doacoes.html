<!DOCTYPE html>
<!--
  minhas-doacoes.html (tela 06 do Figma: Minhas doações)
  Para que serve: o doador acompanha as doações que registrou: filtra por status (abas com contador),
  busca por ONG, campanha ou item, vê o acompanhamento em 3 passos e pode cancelar uma doação oferecida.
  Quem abre: doador. O JS está em js/paginas/doador/minhas-doacoes.js.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acompanhe as doações que você registrou, do envio até o recebimento.">
  <title>Minhas doações · Conecta Doações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/principal.css">
  <link rel="stylesheet" href="../../css/paginas/doador.css">
  <link rel="icon" href="../../img/favicon.svg" type="image/svg+xml">
</head>
<!-- data-raiz diz ao JavaScript onde fica a raiz do site (para montar os links entre páginas em pastas diferentes); data-pagina diz qual item do menu marcar como atual -->
<body data-raiz="../../" data-pagina="minhas-doacoes">
  <!-- Link para quem navega só pelo teclado pular o cabeçalho; fica escondido e aparece quando recebe o foco -->
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <!-- Caixa vazia de propósito: o JavaScript (pagina.js e cabecalho.js) monta aqui o cabeçalho e o menu -->
  <header id="cabecalho"></header>

  <!-- <main> é o conteúdo principal da página (só existe um por página); o id="conteudo" é o destino do link "Pular para o conteúdo" -->
  <main id="conteudo" class="conteudo pilha pilha-grande">
    <h1>Minhas doações</h1>
    <!-- Área de avisos: o JavaScript mostra aqui as mensagens de sucesso e erro; aria-live="polite" faz o leitor de tela anunciar quando o texto muda -->
    <div id="area-alerta" class="area-alerta" aria-live="polite"></div>

    <div class="linha linha-entre">
      <!-- Caixa vazia de propósito: o JavaScript (abas.js) coloca aqui o grupo de abas. Clicar numa aba não muda de página, só troca o conteúdo da lista -->
      <div id="abas"></div>
      <form class="busca" id="formulario-busca" role="search" aria-label="Buscar nas minhas doações">
        <div class="busca-campo" id="campo-busca"></div>
      </form>
    </div>

    <!-- Caixa vazia de propósito: o JavaScript desenha aqui a tabela, e redesenha quando o filtro ou a aba mudam -->
    <div id="lista"></div>

    <!-- Detalhes da doação escolhida (aparece ao clicar em "Ver detalhes") -->
    <section class="cartao" id="secao-detalhe" aria-labelledby="titulo-detalhe" hidden>
      <h2 id="titulo-detalhe">Detalhes da doação</h2>
      <div id="passos"></div>
      <div class="grade-duas" id="colunas"></div>
      <div class="linha linha-entre" id="rodape-detalhe"></div>
    </section>
  </main>

  <!-- Caixa vazia de propósito: o JavaScript (rodape.js) monta aqui o rodapé -->
  <footer id="rodape"></footer>
  <!-- type="module" permite que este JavaScript use import e export para trazer funções de outros arquivos -->
  <script type="module" src="../../js/paginas/doador/minhas-doacoes.js"></script>
</body>
</html>
