<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Entre no Conecta Doações como doador, ONG ou administrador.">
  <title>Entrar · Conecta Doações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/principal.css">
  <link rel="stylesheet" href="../../css/paginas/publico.css">
  <link rel="icon" href="../../img/favicon.svg" type="image/svg+xml">
</head>
<body data-raiz="../../" data-pagina="login">
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

  <header id="cabecalho"></header>

  <main id="conteudo" class="conteudo pagina-formulario">
    <section class="cartao cartao-formulario" aria-labelledby="titulo-pagina">
      <div class="apresentacao-marca">
        <span class="logo-quadrado" id="logo-login"></span>
        <h1 id="titulo-pagina">Entrar</h1>
        <p class="texto-apoio">Conectando quem quer doar a quem precisa</p>
      </div>

      <div id="area-alerta" class="area-alerta"></div>

      <form id="formulario-login" class="pilha" novalidate>
        <div class="campo">
          <label for="identificador">E-mail ou usuário <span class="obrigatorio" aria-hidden="true">*</span></label>
          <input type="text" id="identificador" name="identificador" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="senha">Senha <span class="obrigatorio" aria-hidden="true">*</span></label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        </div>
        <div class="linha linha-entre">
          <div class="opcao">
            <input type="checkbox" id="lembrar" name="lembrar">
            <label for="lembrar">Lembrar-me</label>
          </div>
          <a href="esqueci-senha.html">Esqueci minha senha</a>
        </div>
        <button type="submit" class="botao botao-primario botao-grande botao-bloco">Entrar</button>
      </form>

      <details class="contas-teste">
        <summary>Contas de teste</summary>
        <dl>
          <dt>Doador</dt><dd>doador · doa#2026</dd>
          <dt>Entidade</dt><dd>entidade · ent!2026</dd>
          <dt>Administrador</dt><dd>admin · adm@2026</dd>
        </dl>
      </details>

      <div class="separador"><span>ou</span></div>

      <form id="formulario-conta" class="pilha">
        <fieldset class="pilha pilha-pequena">
          <legend>Ainda não tem conta? Crie como:</legend>
          <div class="opcao">
            <input type="radio" id="tipo-doador" name="tipo" value="doador" checked>
            <label for="tipo-doador">Sou Doador</label>
          </div>
          <div class="opcao">
            <input type="radio" id="tipo-ong" name="tipo" value="ong">
            <label for="tipo-ong">Represento uma ONG</label>
          </div>
        </fieldset>
        <button type="submit" class="botao botao-secundario botao-bloco">Criar conta</button>
      </form>

      <p class="centro"><a href="ongs.html">Ver ONGs sem entrar (visitante)</a></p>
    </section>
  </main>

  <footer id="rodape"></footer>

  <script type="module" src="../../js/paginas/publico/login.js"></script>
</body>
</html>
